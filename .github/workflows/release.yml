name: Build & Release

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.0'
  APP_VERSION: '0.0.1'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      release_tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version info
        id: version
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date +%Y%m%d%H%M%S)

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            # Release build
            TAG="v${{ env.APP_VERSION }}"
            IS_RELEASE="true"
          else
            # Test build (develop / manual)
            TAG="test-v${{ env.APP_VERSION }}-$TIMESTAMP"
            IS_RELEASE="false"
          fi

          echo "code=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Update version
        run: |
          sed -i "s/version: .*/version: 0.0.1+${{ steps.version.outputs.code }}/" pubspec.yaml
          cat pubspec.yaml

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "notion-app-${{ steps.version.outputs.tag }}.apk"

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.is_release == 'true' && format('v{0}', env.APP_VERSION) || format('Test v{0} ({1})', env.APP_VERSION, steps.version.outputs.code) }}
          prerelease: ${{ steps.version.outputs.is_release != 'true' }}
          files: notion-app-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
