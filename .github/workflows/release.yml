name: Release Build

on:
  push:
    branches:
      - develop
      - main
      - release
  pull_request:
    branches: [develop]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version from China timezone
        id: version
        run: |
          VERSION=$(TZ='Asia/Shanghai' date +%Y%m%d)
          echo "code=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update pubspec.yaml version
        run: |
          VERSION="${{ steps.version.outputs.code }}"
          sed -i "s/version: .*/version: 1.0.0+$VERSION/" pubspec.yaml
          cat pubspec.yaml

  build:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (arm64-v8a)
        run: |
          VERSION="${{ needs.version.outputs.version_code }}"
          sed -i "s/version: .*/version: 1.0.0+$VERSION/" pubspec.yaml
          flutter build apk --release --target-platform android-arm64

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notion-app-arm64-v8a-${{ needs.version.outputs.version_code }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: notion-app-aab-${{ needs.version.outputs.version_code }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
