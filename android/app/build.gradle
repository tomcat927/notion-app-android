plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def safeVersionCode
try {
    safeVersionCode = flutterVersionCode.toInteger()
} catch (NumberFormatException e) {
    def last9 = flutterVersionCode.length() > 9 ? flutterVersionCode[-9..-1] : flutterVersionCode
    safeVersionCode = last9.toInteger()
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def keystoreAlias = System.getenv("ANDROID_KEY_ALIAS")
def keystoreKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

android {
    namespace = "com.notion.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.notion.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = safeVersionCode
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile = file(keystorePath)
                storePassword = keystorePassword
                keyAlias = keystoreAlias
                keyPassword = keystoreKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig = (keystorePath != null && !keystorePath.isBlank())
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

flutter {
    source = "../.."
}
